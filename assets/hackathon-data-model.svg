<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="661" viewBox="0 0 1280 661" role="img" aria-labelledby="title desc">
  <title id="title">Модель данных — основные компоненты backend</title>
  <desc id="desc">Схема основных компонентов backend обучающей платформы: сотрудник и доступ, игровой процесс, результаты обучения, уведомления VK и настройки сервера.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#50627a"/>
    </marker>
  </defs>

  <rect width="1280" height="661" fill="#f7f8fb"/>

  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#16243a">
    <text x="35" y="47" font-size="28" font-weight="700">Модель данных · основные компоненты</text>
    <text x="35" y="73" font-size="14" fill="#718096">Что хранит система и как связаны данные · 12 таблиц без полей и типов</text>

    <rect x="1058" y="29" width="187" height="45" rx="12" fill="#eef4fb" stroke="#b7cce7" stroke-width="2"/>
    <text x="1152" y="57" text-anchor="middle" font-size="13" fill="#657790">PostgreSQL / Doctrine</text>

    <!-- Employee and access -->
    <rect x="33" y="109" width="345" height="273" rx="16" fill="#eef5ff" stroke="#a8c8ef" stroke-width="2"/>
    <text x="49" y="139" font-size="21" font-weight="700">Сотрудник и доступ</text>
    <text x="49" y="160" font-size="13" fill="#75849a">Участник, его профиль и вход в систему</text>

    <rect x="47" y="171" width="316" height="52" rx="9" fill="#ffffff" stroke="#d9e2ef"/>
    <text x="58" y="192" font-size="16" font-weight="700">Учётная запись</text>
    <text x="58" y="211" font-size="12" fill="#6f8095" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">app_user</text>

    <rect x="47" y="233" width="316" height="52" rx="9" fill="#ffffff" stroke="#d9e2ef"/>
    <text x="58" y="254" font-size="16" font-weight="700">Профиль сотрудника</text>
    <text x="58" y="273" font-size="12" fill="#6f8095" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">user_profile</text>

    <rect x="47" y="295" width="316" height="52" rx="9" fill="#ffffff" stroke="#d9e2ef"/>
    <text x="58" y="316" font-size="16" font-weight="700">Токен доступа</text>
    <text x="58" y="335" font-size="12" fill="#6f8095" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">access_token</text>

    <!-- Game process -->
    <rect x="428" y="109" width="423" height="273" rx="16" fill="#eefaf3" stroke="#a9dfbf" stroke-width="2"/>
    <text x="444" y="139" font-size="21" font-weight="700">Игровой процесс</text>
    <text x="444" y="160" font-size="13" fill="#75849a">Сценарий → прохождение → оценка эпизода</text>

    <rect x="443" y="171" width="393" height="52" rx="9" fill="#ffffff" stroke="#d9e2ef"/>
    <text x="454" y="192" font-size="16" font-weight="700">Учебный сценарий</text>
    <text x="454" y="211" font-size="12" fill="#6f8095" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">scenario</text>

    <rect x="443" y="233" width="393" height="52" rx="9" fill="#ffffff" stroke="#d9e2ef"/>
    <text x="454" y="254" font-size="16" font-weight="700">Прохождение игры</text>
    <text x="454" y="273" font-size="12" fill="#6f8095" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">game_session</text>

    <rect x="443" y="295" width="393" height="52" rx="9" fill="#ffffff" stroke="#d9e2ef"/>
    <text x="454" y="316" font-size="16" font-weight="700">Попытка по сценарию</text>
    <text x="454" y="335" font-size="12" fill="#6f8095" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">scenario_attempt</text>

    <!-- Results -->
    <rect x="901" y="109" width="346" height="273" rx="16" fill="#f7f2ff" stroke="#cbb9ef" stroke-width="2"/>
    <text x="917" y="139" font-size="21" font-weight="700">Результаты обучения</text>
    <text x="917" y="160" font-size="13" fill="#75849a">Данные для профиля и HR-отчётов</text>

    <rect x="916" y="185" width="316" height="52" rx="9" fill="#ffffff" stroke="#d9e2ef"/>
    <text x="927" y="206" font-size="16" font-weight="700">Статистика сотрудника</text>
    <text x="927" y="225" font-size="12" fill="#6f8095" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">user_statistics</text>

    <rect x="916" y="255" width="316" height="52" rx="9" fill="#ffffff" stroke="#d9e2ef"/>
    <text x="927" y="276" font-size="16" font-weight="700">Достижения</text>
    <text x="927" y="295" font-size="12" fill="#6f8095" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">user_achievement</text>

    <text x="917" y="346" font-size="13" fill="#75849a">Итог игры хранится также в прохождении</text>

    <!-- VK notifications -->
    <rect x="33" y="443" width="637" height="152" rx="16" fill="#fff8ee" stroke="#efc98d" stroke-width="2"/>
    <text x="49" y="473" font-size="21" font-weight="700">Уведомления VK</text>
    <text x="49" y="494" font-size="13" fill="#75849a">Привязка адресата, кампании и история доставки</text>

    <rect x="47" y="511" width="187" height="66" rx="9" fill="#ffffff" stroke="#d9e2ef"/>
    <text x="58" y="532" font-size="15" font-weight="700">Подписка игрока</text>
    <text x="58" y="550" font-size="10.5" fill="#6f8095" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">vk_notification_</text>
    <text x="58" y="565" font-size="10.5" fill="#6f8095" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">subscription</text>

    <rect x="242" y="511" width="190" height="66" rx="9" fill="#ffffff" stroke="#d9e2ef"/>
    <text x="253" y="532" font-size="15" font-weight="700">Кампания</text>
    <text x="253" y="550" font-size="10.5" fill="#6f8095" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">vk_notification_</text>
    <text x="253" y="565" font-size="10.5" fill="#6f8095" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">campaign</text>

    <rect x="440" y="511" width="215" height="66" rx="9" fill="#ffffff" stroke="#d9e2ef"/>
    <text x="451" y="532" font-size="15" font-weight="700">Доставка</text>
    <text x="451" y="550" font-size="10.5" fill="#6f8095" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">vk_notification_</text>
    <text x="451" y="565" font-size="10.5" fill="#6f8095" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">campaign_delivery</text>

    <!-- Server settings -->
    <rect x="706" y="443" width="541" height="152" rx="16" fill="#eef5fb" stroke="#b7cee2" stroke-width="2"/>
    <text x="722" y="473" font-size="21" font-weight="700">Настройки сервера</text>
    <text x="722" y="494" font-size="13" fill="#75849a">Управление игрой и провайдерами из админ-панели</text>

    <rect x="721" y="510" width="511" height="52" rx="9" fill="#ffffff" stroke="#d9e2ef"/>
    <text x="732" y="531" font-size="16" font-weight="700">Параметры игры и ИИ</text>
    <text x="732" y="550" font-size="12" fill="#6f8095" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">server_settings</text>

    <!-- Connections -->
    <line x1="378" y1="239" x2="427" y2="239" stroke="#50627a" stroke-width="2.2" marker-end="url(#arrow)"/>
    <line x1="851" y1="239" x2="900" y2="239" stroke="#50627a" stroke-width="2.2" marker-end="url(#arrow)"/>
    <path d="M205 382 L205 442" fill="none" stroke="#50627a" stroke-width="2.2" marker-end="url(#arrow)"/>
    <path d="M976 443 L976 409 L691 409 L691 383" fill="none" stroke="#50627a" stroke-width="2.2" marker-end="url(#arrow)"/>

    <!-- Footer note -->
    <rect x="33" y="611" width="1214" height="34" rx="9" fill="#ffffff" stroke="#d9e2ef"/>
    <text x="48" y="633" font-size="12.5" fill="#75849a">Стрелки показывают основные связи между компонентами; конкретные внешние ключи и типы полей здесь опущены.</text>
  </g>
</svg>